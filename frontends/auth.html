<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>
GlobalEarn Authentication
</title>

<link
rel="stylesheet"
href="./src/css/styles.css"
/>

</head>

<body>

<section class="auth-page">

    <div class="auth-card">

        <h1>
            GlobalEarn Access
        </h1>

        <p>
            Login or create
            your trading account
        </p>

        <!-- REGISTER -->

        <form id="registerForm">

            <input
            type="text"
            id="registerName"
            placeholder="Full Name"
            required
            />

            <input
            type="email"
            id="registerEmail"
            placeholder="Email"
            required
            />

            <input
            type="text"
            id="registerPhone"
            placeholder="Phone Number"
            />

            <input
            type="text"
            id="registerCountry"
            placeholder="Country"
            />

            <select id="registerGender">

                <option value="">
                    Gender
                </option>

                <option value="male">
                    Male
                </option>

                <option value="female">
                    Female
                </option>

            </select>

            <input
            type="password"
            id="registerPassword"
            placeholder="Password"
            required
            />

            <button
            type="submit"
            class="primary-btn"
            >

                Create Account

            </button>

        </form>

        <hr />

        <!-- LOGIN -->

        <form id="loginForm">

            <input
            type="email"
            id="loginEmail"
            placeholder="Email"
            required
            />

            <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            required
            />

            <button
            type="submit"
            class="primary-btn"
            >

                Login

            </button>

        </form>

    </div>

</section>

<script
src="./src/js/app.js"
></script>

</body>
</html>
